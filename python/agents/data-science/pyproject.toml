[project]
name = "data-science"
version = "0.1.0"
description = "A Data Science agent for automated SQL generation, data analysis, and telemetry-instrumented workflows."
authors = [
    { name = "Google LLC" }
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "python-dotenv>=1.2.4",
    "google-adk>=2.12.0",
    "immutabledict>=4.2.1",
    "sqlglot>=30.23.0",
    "db-dtypes>=1.8.0",
    "regex>=2026.9.29",
    "tabulate>=0.9.0",
    "google-cloud-aiplatform[adk,agent-engines]>=2.5.0",
    "absl-py>=2.5.1",
    "pydantic>=2.14.1",
    "pandas>=3.0.6",
    "numpy>=2.5.4",
    "toolbox-core>=1.4.0",
    "opentelemetry-sdk>=1.36.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "pg8000>=1.31.2",
]

[dependency-groups]
dev = [
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "google-adk[eval]>=2.12.0",
    "ruff>=0.17.1",
    "agent-starter-pack>=0.14.1",
]

[tool.ruff]
# Points back to the Master template in the root
extend = "../../../pyproject.toml"

[tool.ruff.lint]
ignore = ["C901", "PLR0911", "PLR0912", "PLW0603"]

[tool.ruff.lint.isort]
# Ensures the data science source is treated as first-party
known-first-party = ["data_science"]

[tool.hatch.build.targets.wheel]
# Maps the package source correctly for Hatchling
packages = ["data_science"]

[tool.pytest.ini_options]
console_output_style = "progress"
addopts = "-vv -s"
testpaths = ["tests/"]
log_level = "DEBUG"
log_cli = true
log_auto_indent = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "[%(asctime)s] %(levelname)s (%(funcName)s) \t [%(pathname)s:%(lineno)d] %(message)s"
filterwarnings = [
    "ignore::UserWarning",
]

[tool.agent-starter-pack]
example_question = "What data do you have access to?"

[tool.agent-starter-pack.settings]
agent_directory = "data_science"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
